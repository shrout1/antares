package antares.pb.net;

message Packet {
    oneof body {
        Hello    hello    = 1;
        Welcome  welcome  = 2;
        Reject   reject   = 3;
        Setup    setup    = 4;
        Start    start    = 5;
        Turns    turns    = 6;
        Chat     chat     = 7;
        Quit     quit     = 8;
        Choose   choose   = 9;
        Ready    ready    = 10;
    }
}

// Client to host, on connecting.
message Hello {
    optional uint32  protocol           = 1;
    optional string  antares_version    = 2;
    optional string  plugin_identifier  = 3;
    optional string  plugin_version     = 4;
    optional string  name               = 5;
}

message Welcome {
    optional int32  player  = 1;  // admiral number
}

message Reject {
    optional Reason  reason  = 1;

    enum Reason {
        PROTOCOL  = 0;
        VERSION   = 1;
        PLUGIN    = 2;
        FULL      = 3;
    }
}

// Host to clients; sent again whenever it changes.
message Setup {
    optional string  level        = 1;
    optional int32   global_seed  = 2;
    optional uint32  delay        = 3;  // in turns
    repeated Player  player       = 4;

    message Player {
        optional string  name  = 1;
        optional string  race  = 2;
        optional int32   hue   = 3;
    }
}

message Start {}

message Turns {
    optional int32   player     = 1;
    optional uint32  first      = 2;  // number of turn[0]
    repeated Turn    turn       = 3;
    optional uint32  ack        = 4;  // last turn received, without gaps, from the recipient
    optional uint32  sync_turn  = 5;
    optional uint32  sync       = 6;  // g.sync after executing sync_turn

    message Turn {
        repeated Event  event  = 1;
    }

    message Event {
        optional uint32  type  = 1;  // PlayerEventType
        optional int32   data  = 2;
    }
}

message Chat {
    optional int32   player  = 1;
    optional string  text    = 2;
}

message Quit {
    optional int32  player  = 1;
}

// Client to host: the client's own race and color.
message Choose {
    optional string  race  = 1;
    optional int32   hue   = 2;
}

// Sent after the briefing; play starts once every player is ready.
message Ready {}
